; PHP production settings for BrainCortex
date.timezone = ${PHP_TIMEZONE}

; Upload limits
upload_max_filesize = 20M
post_max_size = 20M
max_execution_time = 120
max_input_time = 120
memory_limit = 256M

; Security
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; Session
session.cookie_httponly = 1
session.use_strict_mode = 1
