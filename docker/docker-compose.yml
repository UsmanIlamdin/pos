# =============================================================
#  BrainCortex — Production Docker Compose
#  Location: /pos/docker/docker-compose.yml
#
#  Usage:
#    docker compose --env-file .env up -d --build
#
#  All settings are configured via .env in this folder.
# =============================================================

name: pos

networks:
  pos_net:
    driver: bridge
    name: pos_net

volumes:
  db_data:
    driver: local
  app_uploads:
    driver: local
  traefik_logs:
    driver: local

services:

  # -----------------------------------------------------------
  #  Traefik — Reverse Proxy
  # -----------------------------------------------------------
  traefik:
    image: traefik:v2.11
    container_name: pos-traefik
    restart: unless-stopped
    networks:
      - pos_net
    ports:
      # Bind 0.0.0.0 so phones/PCs on the same Wi‑Fi can reach the app
      - "0.0.0.0:${APP_PORT:-80}:80"
      - "0.0.0.0:${APP_HTTPS_PORT:-443}:443"
      - "0.0.0.0:${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
      - "0.0.0.0:${APP_MARIA_DB_PORT:-3306}:3306"
    environment:
      - DOCKER_API_VERSION=1.44
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro   # Docker provider
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/certs:/etc/traefik/certs:ro
      - traefik_logs:/var/log/traefik
    labels:
      - "traefik.enable=true"
      # Traefik dashboard route (accessible at http://localhost:8080)
      - "traefik.http.routers.dashboard.rule=Host(`traefik.${APP_DOMAIN:-localhost}`)"
      - "traefik.http.routers.dashboard.service=api@internal"

  # -----------------------------------------------------------
  #  App — PHP 8.2 + Apache (BrainCortex)
  # -----------------------------------------------------------
  app:
    build:
      context: ..
      dockerfile: docker/php/Dockerfile
    container_name: pos-app
    restart: unless-stopped
    networks:
      - pos_net
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_uploads:/app/public/uploads
      # CI4 logs on the host (opensourcepos/writable/logs) — not a named Docker volume
      - ../opensourcepos/writable/logs:/app/writable/logs
      # Live PHP application code (Controllers, Models, Views, …).
      # MUST map to /app/app — NOT /app.
      #   /app          = full project root (vendor/, public/, spark, …) from the image
      #   /app/app      = CodeIgniter "app" folder on the host (opensourcepos/app)
      # Mounting opensourcepos/app → /app replaces vendor + public and causes Traefik 404.
      # After rebuilding the image, re-sync gulp CSS/JS tags into header.php:
      #   ./scripts/sync-app-header.sh
      - ../opensourcepos/app:/app/app
      # Docker-only CI4 cache guard (does not modify opensourcepos source)
      - ./php/php.ini:/usr/local/etc/php/conf.d/app.ini:ro
      - ./php/ci4-cache-guard.php:/usr/local/etc/php/ci4-cache-guard.php:ro
      # Keep CI4 config caching enabled without editing opensourcepos/app/Config/Optimize.php
      - ./php/Optimize.php:/app/app/Config/Optimize.php:ro
    environment:
      - CI_ENVIRONMENT=${CI_ENVIRONMENT:-production}
      - PHP_TIMEZONE=${PHP_TIMEZONE:-UTC}
      - APP_DOMAIN=${APP_DOMAIN:-localhost}
      - LAN_IP=${LAN_IP:-127.0.0.1}
      # Accept hostname + LAN IP so Wi‑Fi clients work
      - ALLOWED_HOSTNAMES=${APP_DOMAIN:-localhost},${LAN_IP:-127.0.0.1},localhost
      - app.baseURL=https://${APP_DOMAIN:-localhost}/
      - MYSQL_HOST_NAME=db
      - MYSQL_USERNAME=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DB_NAME=${MYSQL_DATABASE}
      - FORCE_HTTPS=${FORCE_HTTPS:-true}
    command: >
      /bin/sh -c "SCHEME=$$( [ \"$${FORCE_HTTPS}\" = 'true' ] && echo https || echo http );
      if grep -q '^app.baseURL=' /app/.env; then
        sed -i \"s|^app.baseURL=.*|app.baseURL='$${SCHEME}://$${APP_DOMAIN}/'|\" /app/.env;
      else
        echo \"app.baseURL='$${SCHEME}://$${APP_DOMAIN}/'\" >> /app/.env;
      fi;
      if grep -q '^app.allowedHostnames=' /app/.env; then
        sed -i \"s|^app.allowedHostnames=.*|app.allowedHostnames='$${ALLOWED_HOSTNAMES}'|\" /app/.env;
      else
        echo \"app.allowedHostnames='$${ALLOWED_HOSTNAMES}'\" >> /app/.env;
      fi;
      if grep -Eq \"^encryption\\.key=(''|\\\"\\\" )?$$\" /app/.env || ! grep -q '^encryption.key=' /app/.env; then
        KEY=$$(openssl rand -hex 32);
        if grep -q '^encryption.key=' /app/.env; then
          sed -i \"s|^encryption.key=.*|encryption.key=hex2bin:$${KEY}|\" /app/.env;
        else
          echo \"encryption.key=hex2bin:$${KEY}\" >> /app/.env;
        fi;
      fi;
      rm -f /app/writable/cache/FactoriesCache_config /app/writable/cache/FileLocatorCache;
      if grep -q '^logger.threshold=' /app/.env; then
        sed -i 's|^logger.threshold=.*|logger.threshold=4|' /app/.env;
      else
        echo 'logger.threshold=4' >> /app/.env;
      fi;
      mkdir -p /app/writable/logs && chown www-data:www-data /app/writable/logs && chmod 775 /app/writable/logs;
      apache2-foreground"
    labels:
      - "traefik.enable=true"
      # Match hostname, Wi‑Fi/LAN IP, and localhost — LAN_IP comes from .env (kept in sync by start.sh)
      - "traefik.http.routers.app.rule=Host(`${APP_DOMAIN:-localhost}`) || Host(`${LAN_IP:-127.0.0.1}`) || Host(`localhost`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls=true"
      - "traefik.http.services.app.loadbalancer.server.port=80"
    healthcheck:
      # Use APP_DOMAIN Host header so healthchecks never pin baseURL to localhost
      test: ["CMD-SHELL", "curl -sf -H \"Host: $${APP_DOMAIN:-localhost}\" http://127.0.0.1/ || curl -sf http://127.0.0.1/ -o /dev/null -w '%{http_code}' | grep -qE '(200|301|302|404)'"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 90s

  # -----------------------------------------------------------
  #  Database — MariaDB 10.11
  # -----------------------------------------------------------
  db:
    image: mariadb:10.11
    container_name: pos-db
    restart: unless-stopped
    networks:
      - pos_net
    labels:
      - "traefik.enable=true"
      - "traefik.tcp.routers.mariadb.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.mariadb.entrypoints=mariadb"
      - "traefik.tcp.routers.mariadb.service=mariadb"
      - "traefik.tcp.services.mariadb.loadbalancer.server.port=3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./mariadb/init:/docker-entrypoint-initdb.d:ro   # SQL init scripts
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MARIADB_AUTO_UPGRADE=1
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # -----------------------------------------------------------
  #  Backup — Automated DB backup sidecar
  # -----------------------------------------------------------
  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    container_name: pos-backup
    restart: unless-stopped
    networks:
      - pos_net
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/backups    # Backups appear in docker/backups/ on your host
    environment:
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - BACKUP_INTERVAL_HOURS=${BACKUP_INTERVAL_HOURS:-12}
      - BACKUP_KEEP_DAYS=${BACKUP_KEEP_DAYS:-7}
